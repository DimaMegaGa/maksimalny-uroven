name: Container checks and image
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [jury-v*]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Client regression checks
        run: node tests/test-client.cjs
      - run: docker build -t maks-level:submission .
      - name: Integration tests in Linux container
        run: docker run --rm --entrypoint python maks-level:submission backend/test_container.py
      - name: Compose startup
        run: |
          docker compose up -d --wait --wait-timeout 90
          curl --fail http://127.0.0.1:19111/api/health
          curl --fail http://127.0.0.1:19112/api/health
      - if: always()
        run: docker compose down
      - run: docker save -o maks-level-image.tar maks-level:submission
      - uses: actions/upload-artifact@v4
        with:
          name: maks-level-image
          path: maks-level-image.tar
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/jury-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maks-level-image
      - name: Publish Docker image as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gzip maks-level-image.tar
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" maks-level-image.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" maks-level-image.tar.gz --repo "$GITHUB_REPOSITORY" --verify-tag --title "МАКСимальный Уровень — версия для жюри" --notes "Docker-образ. Распакуйте через gzip -d и загрузите через docker load -i maks-level-image.tar."
          fi
